# ─────────────────────────────────────────────────────────
#  Redis config for Temporary Email Service
#  Key goals: fast ephemeral writes, keyspace notifications,
#  no persistence (data is intentionally short-lived).
# ─────────────────────────────────────────────────────────

# Bind to all interfaces inside Docker network
bind 0.0.0.0

# No persistence — all data is ephemeral by design
save ""
appendonly no

# ── Memory management ────────────────────────────────────
# Cap at 512 MB; evict oldest expiring keys when full
maxmemory 512mb
maxmemory-policy volatile-ttl

# ── Keyspace notifications ───────────────────────────────
# Notify on: expired events (x) + generic commands (g)
# Consumers can subscribe to __keyevent@0__:expired
# and clean up in-app state on inbox expiry.
notify-keyspace-events "Ex"

# ── Security ─────────────────────────────────────────────
# requirepass is set via environment variable REDIS_PASSWORD
# in docker-compose; comment this out for local dev.
# requirepass changeme

# Disable commands that could be misused
rename-command FLUSHALL  ""
rename-command FLUSHDB   ""
rename-command CONFIG    ""
rename-command DEBUG     ""
rename-command SHUTDOWN  "SHUTDOWN_SAFE"

# ── Performance ──────────────────────────────────────────
tcp-backlog         511
tcp-keepalive       300
hz                  20          # expiry check frequency (10–20 recommended)
lazyfree-lazy-expire yes        # async key deletion on expire (non-blocking)
lazyfree-lazy-eviction yes

# ── Logging ──────────────────────────────────────────────
loglevel notice
logfile ""

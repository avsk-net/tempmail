worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=inbox:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;

    upstream api_backend {
        ip_hash;
        server api:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Block internal routes from reaching the API
        location /internal/ { deny all; return 403; }

        # UI — served from mounted volume
        root /usr/share/nginx/ui;
        index index.html;

        location /api/inbox {
            limit_req  zone=inbox burst=5 nodelay;
            limit_conn perip 20;
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
        }

        location /api/ {
            limit_req  zone=api burst=20 nodelay;
            limit_conn perip 20;
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /socket.io/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        location /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}

version: "3.9"

# ─────────────────────────────────────────────────────────
#  Temporary Email Service — Docker Compose
#
#  Services:
#    redis   — ephemeral store (no persistence)
#    api     — Express REST + WebSocket server
#    smtp    — SMTP ingest (port 25)
#    nginx   — TLS termination + reverse proxy
#    certbot — Let's Encrypt certificate renewal
# ─────────────────────────────────────────────────────────

services:

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # No data volume — intentional, all data is ephemeral
    networks:
      - internal
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    deploy:
      resources:
        limits:
          memory: 600m

  # ── API Service ────────────────────────────────────────
  api:
    build:
      context:    ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              "3000"
      REDIS_URL:         redis://redis:6379
      MAIL_DOMAIN:       ${MAIL_DOMAIN:-tmpbox.io}
      INBOX_TTL_SECONDS: "600"
    networks:
      - internal
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout:  5s
      retries:  3
    deploy:
      replicas: 2           # scale horizontally; nginx round-robins
      resources:
        limits:
          memory: 256m

  # ── SMTP Ingest ────────────────────────────────────────
  smtp:
    build:
      context:    ./smtp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SMTP_PORT:        "25"
      MAIL_DOMAIN:      ${MAIL_DOMAIN:-tmpbox.io}
      API_INTERNAL_URL: http://api:3000
      MAX_MSG_BYTES:    "5242880"   # 5 MB
    ports:
      - "25:25"     # MX records point here; open port 25 on your VPS firewall
      - "2525:25"   # alternative if port 25 blocked by ISP; update MX accordingly
    networks:
      - internal
      - external    # needs to receive mail from the internet
    deploy:
      resources:
        limits:
          memory: 128m

  # ── Nginx ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - internal
      - external
    healthcheck:
      test:     ["CMD", "nginx", "-t"]
      interval: 30s
      timeout:  5s
      retries:  3

  # ── Certbot (Let's Encrypt) ────────────────────────────
  certbot:
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

# ── Networks ───────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true    # no direct internet access — services must go through nginx/smtp
  external:
    driver: bridge

# ── Volumes ────────────────────────────────────────────
volumes:
  certbot_www:
  certbot_certs:

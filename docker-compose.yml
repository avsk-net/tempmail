services:

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    deploy:
      resources:
        limits:
          memory: 600m

  api:
    build:
      context:    ./api
      network:    host
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              "3000"
      REDIS_URL:         redis://redis:6379
      MAIL_DOMAIN:       ${MAIL_DOMAIN:-alldomainblocked.xyz}
      INBOX_TTL_SECONDS: "600"
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout:  5s
      retries:  3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256m

  smtp:
    build:
      context:    ./smtp
      network:    host
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SMTP_PORT:        "25"
      MAIL_DOMAIN:      ${MAIL_DOMAIN:-alldomainblocked.xyz}
      API_INTERNAL_URL: http://api:3000
      MAX_MSG_BYTES:    "5242880"
    ports:
      - "25:25"
      - "2525:2525"
    deploy:
      resources:
        limits:
          memory: 128m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ui:/usr/share/nginx/ui:ro
    healthcheck:
      test:     ["CMD", "nginx", "-t"]
      interval: 30s
      timeout:  5s
      retries:  3

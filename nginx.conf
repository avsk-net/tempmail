# ─────────────────────────────────────────────────────────
#  Nginx config for Temporary Email Service
#  Handles: TLS termination, rate limiting, blocking internal
#  routes from the public internet.
# ─────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;
    client_max_body_size 10m;

    # ── Rate limiting zones ──────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=inbox:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;

    # ── Upstream: API service ────────────────────────────
    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.tmpbox.io;   # ← replace with your domain

        ssl_certificate     /etc/letsencrypt/live/api.tmpbox.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.tmpbox.io/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;

        # ── BLOCK internal routes from public internet ───
        location /internal/ {
            deny all;
            return 403;
        }

        # ── Public API ───────────────────────────────────
        location /api/inbox {
            limit_req   zone=inbox burst=5 nodelay;
            limit_conn  perip 20;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/ {
            limit_req   zone=api burst=20 nodelay;
            limit_conn  perip 20;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket (Socket.io) ────────────────────────
        location /socket.io/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Health check ─────────────────────────────────
        location /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
    }
}

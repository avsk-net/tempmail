<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TempMail</title>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#533ab7;--acc-bg:#eeedfe;--acc-t:#3c3489;--grn:#1d9e75;--grn-bg:#e1f5ee;--grn-t:#0f6e56;--red:#e24b4a;--red-bg:#fcebeb;--b:rgba(0,0,0,.09);--t1:#1a1a18;--t2:#5f5e5a;--t3:#888780;--mono:'SF Mono','Fira Code',monospace}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f9f8;color:var(--t1);min-height:100vh;font-size:15px}
.w{max-width:660px;margin:0 auto;padding:2rem 1.5rem 4rem}
header{display:flex;align-items:center;gap:10px;padding-bottom:1.25rem;border-bottom:.5px solid var(--b);margin-bottom:1.75rem}
.logo{width:34px;height:34px;background:var(--acc-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
h1{font-size:16px;font-weight:500}.hs{font-size:12px;color:var(--t3)}.ml{margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}
.bg{background:var(--grn-bg);color:var(--grn-t)}.bp{background:var(--acc-bg);color:var(--acc-t)}
.card{background:#fff;border:.5px solid var(--b);border-radius:16px;padding:2rem;margin-bottom:1.25rem}
.empty{text-align:center;padding:2.5rem 1rem}
.icon-w{width:60px;height:60px;background:var(--acc-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:26px}
h2{font-size:17px;font-weight:500;margin-bottom:.5rem}.desc{font-size:13px;color:var(--t2);max-width:300px;margin:0 auto 1.5rem;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:.5px solid rgba(0,0,0,.14);background:transparent;color:var(--t1);transition:background .12s;font-family:inherit}
.btn:hover{background:rgba(0,0,0,.05)}.btn-p{background:var(--acc);color:#fff;border-color:transparent}.btn-p:hover{background:var(--acc-t)}
.btn-s{padding:6px 12px;font-size:12px}.btn-gh{border-color:transparent;color:var(--t2)}.btn-d{background:var(--red-bg);color:var(--red);border-color:transparent}
.on{display:block!important}.active-st{display:none}
.addr-hdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:.5px solid var(--b)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grn);margin-top:6px;flex-shrink:0;box-shadow:0 0 0 3px var(--grn-bg);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--grn-bg)}50%{box-shadow:0 0 0 6px var(--grn-bg)}}
.ai{flex:1;min-width:0}.al{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:3px}
.av{font-family:var(--mono);font-size:14px;font-weight:500;word-break:break-all;margin-bottom:8px}
.am{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.aa{display:flex;gap:6px;flex-shrink:0}
.tw{display:flex;align-items:center;gap:8px}.tl{font-size:12px;color:var(--t2)}.tv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.lt{font-size:13px;font-weight:500;color:var(--t2)}
.er{padding:11px 8px;border-bottom:.5px solid var(--b);cursor:pointer;display:flex;gap:10px;border-radius:4px;margin:0 -8px;transition:background .1s}
.er:last-child{border-bottom:none}.er:hover{background:#f9f9f8}.er.unr .es{font-weight:500}
.ed{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0;margin-top:5px}.ed.rd{background:transparent}
.eb{flex:1;min-width:0}.ef{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.et{font-size:10px;color:var(--t3);flex-shrink:0;margin-top:2px}
.nm{text-align:center;padding:2rem 1rem;color:var(--t3);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal.open{display:flex}.mbox{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.mh{padding:1.25rem 1.5rem;border-bottom:.5px solid var(--b);display:flex;gap:10px;align-items:flex-start}
.mi{flex:1;min-width:0}.ms{font-size:15px;font-weight:500;margin-bottom:4px}.mf{font-size:12px;color:var(--t2)}.md{font-size:11px;color:var(--t3);flex-shrink:0;white-space:nowrap}
.mb{flex:1;overflow-y:auto;padding:1.25rem;font-size:13px;color:var(--t2);white-space:pre-wrap;line-height:1.8}
.mft{padding:.75rem 1.5rem;border-top:.5px solid var(--b);display:flex;justify-content:flex-end}
.tc{position:fixed;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:6px;z-index:200}
.toast{display:flex;align-items:center;gap:8px;background:#1a1a18;color:#fff;padding:9px 14px;border-radius:10px;font-size:12px;font-weight:500;animation:si .2s ease}
.tok{background:var(--grn)}.ter{background:var(--red)}
@keyframes si{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<div class="w">
<header>
  <div class="logo">📬</div>
  <div><h1>TempMail</h1><div class="hs">10-minute disposable inbox</div></div>
  <div class="ml"><span class="badge bg" id="ws">● Live</span></div>
</header>
<div class="card">
  <div class="empty" id="empty-st">
    <div class="icon-w">📥</div>
    <h2>Get a temporary inbox</h2>
    <p class="desc">Generate a disposable email. All messages appear instantly and auto-delete after 10 minutes.</p>
    <button class="btn btn-p" id="cbtn" onclick="createInbox()">+ Generate inbox</button>
  </div>
  <div class="active-st" id="active-st">
    <div class="addr-hdr">
      <div class="dot"></div>
      <div class="ai">
        <div class="al">Your temporary address</div>
        <div class="av" id="iaddr">—</div>
        <div class="am">
          <div class="tw">
            <svg width="34" height="34" viewBox="0 0 34 34">
              <circle fill="none" stroke="rgba(0,0,0,.1)" stroke-width="3" cx="17" cy="17" r="13"/>
              <circle id="tarc" fill="none" stroke="#1d9e75" stroke-width="3" stroke-linecap="round" cx="17" cy="17" r="13" stroke-dasharray="81.68" stroke-dashoffset="0" transform="rotate(-90 17 17)" style="transition:stroke-dashoffset 1s linear,stroke 1s"/>
              <text id="tmin" x="17" y="17" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="500" fill="#1a1a18">10m</text>
            </svg>
            <div><div class="tl">Expires in</div><div class="tv" id="tval">10:00</div></div>
          </div>
          <span class="badge bp" id="cbadge">0 emails</span>
        </div>
      </div>
      <div class="aa">
        <button class="btn btn-s" onclick="copyA()">⎘ Copy</button>
        <button class="btn btn-s btn-d" onclick="delInbox()">🗑</button>
      </div>
    </div>
    <div class="lh"><span class="lt">Inbox</span><button class="btn btn-s btn-gh" onclick="refresh()">↻ Refresh</button></div>
    <div id="elist"><div class="nm">Waiting for mail… send an email to your address above</div></div>
  </div>
</div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="mbox">
    <div class="mh"><div class="mi"><div class="ms" id="msub">—</div><div class="mf" id="mfrm">—</div></div><div class="md" id="mdate">—</div></div>
    <div class="mb" id="mbody">Loading…</div>
    <div class="mft"><button class="btn btn-s btn-gh" onclick="closeM()">✕ Close</button></div>
  </div>
</div>
<div class="tc" id="tc"></div>
<script>
const C=2*Math.PI*13;
let S={address:null,expiresAt:null,ttl:600,emails:[],timer:null,socket:null};
function sock(){
  S.socket=io(location.origin,{transports:['websocket','polling']});
  S.socket.on('connect',()=>setWs('connected'));
  S.socket.on('disconnect',()=>setWs('disconnected'));
  S.socket.on('email:new',e=>{if(S.emails.find(x=>x.id===e.id))return;S.emails.unshift({...e,read:false});renderL();updateB();toast('New mail: '+(e.subject||'(no subject)'),'tok');});
  S.socket.on('inbox:deleted',()=>{toast('Inbox expired','ter');resetE();});
}
function setWs(st){const el=document.getElementById('ws');el.className='badge '+(st==='connected'?'bg':'bp');el.textContent='● '+(st==='connected'?'Live':st==='disconnected'?'Offline':'Connecting');}
async function createInbox(){
  const btn=document.getElementById('cbtn');btn.disabled=true;btn.textContent='Generating…';
  try{const r=await fetch('/api/inbox',{method:'POST'});if(!r.ok)throw new Error();const d=await r.json();S.address=d.address;S.expiresAt=d.expiresAt;S.ttl=d.ttlSeconds;S.emails=[];showA();startT();S.socket.emit('subscribe',{address:S.address});toast('Inbox ready!','tok');}
  catch(e){toast('Failed — check API logs','ter');btn.disabled=false;btn.textContent='+ Generate inbox';}
}
function showA(){document.getElementById('empty-st').style.display='none';document.getElementById('active-st').classList.add('on');document.getElementById('iaddr').textContent=S.address;renderL();updateB();}
function resetE(){clearInterval(S.timer);S={...S,address:null,expiresAt:null,emails:[]};document.getElementById('empty-st').style.display='';document.getElementById('active-st').classList.remove('on');const btn=document.getElementById('cbtn');btn.disabled=false;btn.textContent='+ Generate inbox';}
function startT(){clearInterval(S.timer);tick();S.timer=setInterval(tick,1000);}
function tick(){const rem=Math.max(0,Math.floor((S.expiresAt-Date.now())/1000));const f=rem/S.ttl;const m=Math.floor(rem/60),s=rem%60;document.getElementById('tval').textContent=`${m}:${s.toString().padStart(2,'0')}`;document.getElementById('tmin').textContent=m>0?`${m}m`:`${s}s`;const a=document.getElementById('tarc');a.style.strokeDashoffset=C*(1-f);a.style.stroke=f>.33?'#1d9e75':f>.1?'#ba7517':'#e24b4a';if(rem===0){clearInterval(S.timer);toast('Inbox expired','ter');resetE();}}
async function refresh(){if(!S.address)return;const r=await fetch(`/api/inbox/${encodeURIComponent(S.address)}/emails`);if(!r.ok)return;const d=await r.json();const read=new Set(S.emails.filter(e=>e.read).map(e=>e.id));S.emails=(d.emails||[]).map(e=>({...e,read:read.has(e.id)}));renderL();updateB();}
async function delInbox(){if(!S.address||!confirm('Delete?'))return;await fetch(`/api/inbox/${encodeURIComponent(S.address)}`,{method:'DELETE'});toast('Deleted','tok');resetE();}
function renderL(){const el=document.getElementById('elist');if(!S.emails.length){el.innerHTML='<div class="nm">Waiting for mail… send an email to your address above</div>';return;}el.innerHTML=S.emails.map(e=>`<div class="er ${e.read?'':'unr'}" onclick="openE('${e.id}')"><div class="ed ${e.read?'rd':''}"></div><div class="eb"><div class="ef">${esc(e.from||'')}</div><div class="es">${esc(e.subject||'(no subject)')}</div><div class="ep">${esc(e.bodyPreview||'')}</div></div><div class="et">${fd(e.date)}</div></div>`).join('');}
function updateB(){const n=S.emails.length;document.getElementById('cbadge').textContent=`${n} email${n!==1?'s':''}`;}
async function openE(id){const e=S.emails.find(x=>x.id===id);if(e)e.read=true;renderL();document.getElementById('msub').textContent=e?.subject||'(no subject)';document.getElementById('mfrm').textContent='From: '+(e?.from||'—');document.getElementById('mdate').textContent=fd(e?.date);document.getElementById('mbody').textContent='Loading…';document.getElementById('modal').classList.add('open');try{const r=await fetch(`/api/inbox/${encodeURIComponent(S.address)}/emails/${id}`);const d=await r.json();document.getElementById('mbody').textContent=d.email?.text||d.email?.html?.replace(/<[^>]+>/g,'')||'(empty)';}catch(e){document.getElementById('mbody').textContent='Failed to load.';}}
function closeM(){document.getElementById('modal').classList.remove('open');}
function copyA(){navigator.clipboard?.writeText(S.address);toast('Copied!','tok');}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fd(iso){if(!iso)return'';const d=new Date(iso),diff=Date.now()-d;if(diff<60000)return'just now';if(diff<3600000)return Math.floor(diff/60000)+'m ago';return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function toast(msg,type=''){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;document.getElementById('tc').appendChild(el);setTimeout(()=>el.remove(),3000);}
sock();
</script>
</body>
</html>
